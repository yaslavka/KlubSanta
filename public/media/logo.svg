<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Klub Santa crest">
  <defs>
    <linearGradient id="ksGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8DFAF"/>
      <stop offset="55%" stop-color="#D0A56A"/>
      <stop offset="100%" stop-color="#B08A4F"/>
    </linearGradient>
    <radialGradient id="ksCrimson" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#A11224"/>
      <stop offset="100%" stop-color="#5C0810"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#ksGold)"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#F8DFAF" stroke-width="1.6" stroke-dasharray="2 3"/>
  <circle cx="60" cy="60" r="49" fill="url(#ksCrimson)"/>
  <!-- North star -->
  <path d="M60 14 L63.2 24.8 L74 28 L63.2 31.2 L60 42 L56.8 31.2 L46 28 L56.8 24.8 Z" fill="url(#ksGold)"/>
  <!-- KS monogram -->
  <text x="60" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="38" fill="url(#ksGold)" letter-spacing="1">KS</text>
  <!-- ribbon line -->
  <line x1="34" y1="92" x2="86" y2="92" stroke="url(#ksGold)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="99" r="2.2" fill="url(#ksGold)"/>
</svg>
